{% extends "base.html" %}


{% block main_content %}
<h1>Update Movie</h1>



<div class="box">
<!-- change to post later -->
<form action="{{url_for('update_movie', movie_id = movie.tt)}}" method="POST">

<label for="kind">Use "None" or "null" to set a field to null. Only Title, Release Year, and Director can be null.</label>

<p>
    <label>Title: 
        <input type="text" name="movie-title" value = "{{movie.title if movie else ''}}" >
    </label> </p>
<p>
    <label>Movie ID: 
        <input type="text" name="movie-tt" value="{{movie.tt if movie else ''}}" required></label></p>

<p><label>Release Year: 
    <input type="text" name="movie-release" value = "{{movie.release if movie else ''}}" ></label></p>

<p><label>Added by: 
    <input type="text" name="movie-addedby" value = "{{movie.addedby if movie else 'None'}}" 
    required></label></p>

<p><label>Director ID: 
    <input type="text" name="director-id" value="{{movie.director_id if movie else 'None'}}"></label></p>

<p><label>Director: <input type="text"  name="director" value= "{{movie.director if movie.director else 'None specified' }}" disabled></label></p>
   
<button type="submit" name="action" value="update">Update</button>   
<button type="submit" name="action" value="delete">Delete</button>   

</form>
</div>



{% endblock %}
