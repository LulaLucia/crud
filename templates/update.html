{% extends "base.html" %}

{% block main_content %}

<h1>Update Movie</h1>

<!-- form for either deleting a movie, or updating it's details
    all details are modifiable except director-name,
    which is linked to person.name and displayed through sql joins later
-->
<div class="box">
<form action="{{url_for('update_movie', movie_id = movie.tt)}}" method="POST">

<p>Use "None" or "null" to set a field to null. Only Title, Release Year, and Director can be null</p>


    <label>Title: 
        <input type="text" name="movie-title" value = "{{movie.title if movie else ''}}" >
    </label> </p>
<p>
    <label>Movie ID: 
        <input type="text" name="movie-tt" value="{{movie.tt if movie else ''}}" required></label></p>

<p><label>Release Year: 
    <input type="text" name="movie-release" value = "{{movie.release if movie else ''}}" ></label></p>

<p><label>Added By: 
    <input type="text" name="movie-addedby" value = "{{movie.addedby if movie else 'None'}}" 
    required></label></p>

<p><label>Director ID: 
    <input type="text" name="movie-director" value="{{movie.director_id if movie else 'None'}}"></label></p>

<p><label>Director: <input type="text"  name="director-name" value= "{{movie.director if movie.director else 'None specified' }}" disabled></label></p>
   
<input type="submit" name="submit" value="update">
<input type="submit" name="submit" value="delete">

</form>
</div>

{% endblock %}
