{% extends "base.html" %}


{% block main_content %}
<h1>Insert Movie</h1>


<br>

<div class="box">
<!-- change to post later -->
<form action="{{url_for('insert_movie')}}" method= "post">

<label for="kind">Movie Data</label>

<p> 
<label for= "movie-tt"> (i) Movie ID/TT: </label>
<input type="number" id="movie-tt" name="movie-tt">
</p>
<label for="movie-title">(t) Movie Title: </label>
<input type="text" id="movie-title" name="movie-title" >

<p>
<label for= "movie-release"> (r) Movie Release Year:</label> 
<input type="number" id="movie-release" name="movie-release" > </p>


<button type="submit">Insert Movie</button>   
</form>
</div>

{% endblock %}
