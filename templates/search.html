
{% extends "base.html" %}


{% block main_content %}
<h1>Search by Title</h1>

<form action= "{{url_for('search_by_title')}}" method="GET" >

<label>Title <input type="text" id="search" name="search" required></label>

 <button type="submit">Search</button>   


{% for movie in results %} 
    
        <label for= "title"> Title: {{movie.title}} </label>

       <p>Movie Id: {{ movie.tt}} </p>
        <p>Release year {{ movie.release }} </p>
         <p>Added by {{ movie.addedby }} </p>
       <p>Director ID: {{movie.director}} </p>
       <p>Director Name: {{movie.name}} </p>

        
{% endfor %}

{%}

{% endblock %}
