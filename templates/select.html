{% extends "base.html" %}

{% block main_content %}
<h1>Select Movies</h1>

<br>

<div class="box">
<!-- change to post later -->
<form action="/select/" method="GET">

    <label for = "dropdown">Movies without release dates or directors: </label>
    <select id="dropdown" name="drop">

    <option value="">Choose a movie:</option>

    <ul>
        {% for movie in incomplete_movies %}
            <li><option value="{{ movie[0] }}">{{ movie[1] }}</option></li>
        {% endfor %}
    </ul>
    
    </select>

<button type="submit">Insert Movie</button>   
</form>
</div>


{% endblock %}
