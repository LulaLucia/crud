{% extends "base.html" %}

{% block main_content %}
<h1>Select Movies</h1>

<br>

<div class="box">
<!-- change to post later
-->
<form action="{{ url_for('select_incomplete_movies') }}" method="POST">

    <label for = "dropdown">Movies without release dates or directors: </label>

    <select id="dropdown" name="menu-tt">
        <option value="">Choose an incomplete movie:</option>

    
    {% for movie in incomplete_movies %}
        <option value="{{ movie.tt }}">{{ movie.title }}</option>
    {% endfor %}

    </select>

     <input type="submit" name= "submit" value= "Select" >   

</form>
</div>


{% endblock %}
